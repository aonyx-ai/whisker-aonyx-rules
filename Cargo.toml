# Every rule in this repository is a whisker plugin: a cdylib that whisker
# builds at check time and loads into its own process. Rust has no stable ABI,
# so a plugin is only coherent with the whisker that loads it when the same
# rustc compiled both from the same whisker source. That is why the pin below
# and `rust-toolchain.toml` move together, and why a mismatch is a loud
# refusal rather than a subtle wrong answer.
[workspace]
members = ["lints/*"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/whisker-aonyx-rules.git"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
proptest = "1"
# `DecoratedNode::raw()` returns a `tree_sitter::Node`, which some rules name
# directly. The version matches whisker's own so that the plugin and the host
# agree on the type that crosses the boundary.
tree-sitter = "0.27"
# One pin for every rule. Whisker is not published, so these are git
# dependencies. The commit decides which rustc and which whisker source
# produced a plugin, and a tag can be moved, so the pin is a commit and
# the release beside it says which one. Renovate reads the pair through a
# custom manager and moves both, the way it moves a pinned action. Bump
# `rust-toolchain.toml` with them when whisker's does.
whisker-rust = { git = "https://github.com/aonyx-ai/whisker.git", rev = "4da6161790386c8093b4c8437434fd933b900a23", default-features = false } # v0.1.0-rc.3
whisker-testing = { git = "https://github.com/aonyx-ai/whisker.git", rev = "4da6161790386c8093b4c8437434fd933b900a23" } # v0.1.0-rc.3
whisker-types = { git = "https://github.com/aonyx-ai/whisker.git", rev = "4da6161790386c8093b4c8437434fd933b900a23" } # v0.1.0-rc.3
